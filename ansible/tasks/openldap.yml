---
# Déploiement d'OpenLDAP
- name: Ajout du dépôt Helm BitnameS
  kubernetes.core.helm_repository:
    name: bitnami
    repo_url: https://charts.bitnami.com/bitnami

- name: Création du secret pour OpenLDAP
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: openldap-secrets
        namespace: auth
      type: Opaque
      stringData:
        LDAP_ADMIN_PASSWORD: "{{ openldap_admin_password }}"
        LDAP_CONFIG_PASSWORD: "{{ openldap_config_password }}"

- name: Création du fichier de valeurs pour OpenLDAP
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/files/openldap-values.yaml"
    content: |
      replicaCount: {{ openldap_replicas }}
      
      existingSecret: openldap-secrets
      
      ldapDomain: "{{ openldap_domain }}"
      ldapOrganization: "{{ openldap_organization }}"
      
      persistence:
        enabled: true
        storageClass: "efs-sc"
        size: 5Gi
      
      service:
        type: ClusterIP
        port: 389
        ldapsPort: 636
      
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      
      livenessProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
      
      readinessProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
      
      phpldapadmin:
        enabled: true
        ingress:
          enabled: true
          annotations:
            kubernetes.io/ingress.class: alb
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
            alb.ingress.kubernetes.io/ssl-redirect: "443"
          hosts:
            - "phpldapadmin.{{ openldap_domain }}"

- name: Déploiement d'OpenLDAP
  kubernetes.core.helm:
    name: openldap
    chart_ref: bitnami/openldap
    release_namespace: auth
    create_namespace: false
    values_files:
      - "{{ playbook_dir }}/files/openldap-values.yaml"

- name: Attente qu'OpenLDAP soit prêt
  kubernetes.core.k8s_info:
    kind: StatefulSet
    name: openldap
    namespace: auth
  register: openldap_sts
  until: openldap_sts.resources[0].status.readyReplicas is defined and openldap_sts.resources[0].status.readyReplicas > 0
  retries: 10
  delay: 30

- name: Création d'un service pour exposer OpenLDAP dans le VPC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: openldap-vpc
        namespace: auth
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
          service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      spec:
        type: LoadBalancer
        ports:
        - name: ldap
          port: 389
          targetPort: 389
        - name: ldaps
          port: 636
          targetPort: 636
        selector:
          app.kubernetes.io/name: openldap
          app.kubernetes.io/instance: openldap

- name: Configuration de la synchronisation entre Keycloak et OpenLDAP
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: keycloak-ldap-config
        namespace: auth
      spec:
        template:
          spec:
            containers:
            - name: keycloak-ldap-config
              image: curlimages/curl:7.87.0
              command:
                - "/bin/sh"
                - "-c"
                - |
                  # Attendre que Keycloak soit prêt
                  sleep 30
                  
                  # Obtenir un token d'accès Keycloak
                  TOKEN=$(curl -s -d "client_id=admin-cli" -d "username=$KEYCLOAK_ADMIN" -d "password=$KEYCLOAK_ADMIN_PASSWORD" -d "grant_type=password" \
                  "http://keycloak-private:8080/realms/master/protocol/openid-connect/token" | sed 's/.*access_token":"\\([^"]*\\).*/\\1/')
                  
                  # Créer une connexion LDAP
                  curl -X POST http://keycloak-private:8080/admin/realms/master/components \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d '{
                      "name": "openldap",
                      "providerId": "ldap",
                      "providerType": "org.keycloak.storage.UserStorageProvider",
                      "parentId": "master",
                      "config": {
                        "connectionUrl": ["ldap://openldap:389"],
                        "editMode": ["READ_ONLY"],
                        "usersDn": ["ou=users,dc=example,dc=com"],
                        "usernameLDAPAttribute": ["uid"],
                        "uuidLDAPAttribute": ["entryUUID"],
                        "rdnLDAPAttribute": ["uid"],
                        "userObjectClasses": ["inetOrgPerson, organizationalPerson"],
                        "authType": ["simple"],
                        "bindDn": ["cn=admin,dc=example,dc=com"],
                        "bindCredential": ["'"$LDAP_ADMIN_PASSWORD"'"],
                        "vendor": ["other"],
                        "syncRegistrations": ["false"],
                        "batchSizeForSync": ["1000"],
                        "fullSyncPeriod": ["86400"],
                        "changedSyncPeriod": ["300"],
                        "cachePolicy": ["DEFAULT"],
                        "usePasswordModifyExtendedOp": ["false"],
                        "importUsers": ["true"],
                        "enabled": ["true"]
                      }
                    }'
              env:
                - name: KEYCLOAK_ADMIN
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-secret
                      key: KEYCLOAK_ADMIN
                - name: KEYCLOAK_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db-secret
                      key: KEYCLOAK_ADMIN_PASSWORD
                - name: LDAP_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: openldap-secrets
                      key: LDAP_ADMIN_PASSWORD
            restartPolicy: OnFailure
        backoffLimit: 3