---
# Déploiement de CephFS
- name: Ajout du dépôt Helm Rook-Ceph
  kubernetes.core.helm_repository:
    name: rook-release
    repo_url: https://charts.rook.io/release

- name: Création du fichier de valeurs pour l'opérateur Rook
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/files/rook-ceph-operator-values.yaml"
    content: |
      image:
        repository: rook/ceph
        tag: v{{ ceph_version }}
      
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      
      csi:
        enableRbdDriver: true
        enableCephfsDriver: true
        provisionerReplicas: 2
        
      monitoring:
        enabled: true
        createPrometheusRules: true

- name: Déploiement de l'opérateur Rook-Ceph
  kubernetes.core.helm:
    name: rook-ceph
    chart_ref: rook-release/rook-ceph
    release_namespace: storage
    create_namespace: false
    values_files:
      - "{{ playbook_dir }}/files/rook-ceph-operator-values.yaml"

- name: Attente que l'opérateur Rook-Ceph soit prêt
  kubernetes.core.k8s_info:
    kind: Deployment
    name: rook-ceph-operator
    namespace: storage
  register: rook_deployment
  until: rook_deployment.resources[0].status.readyReplicas is defined and rook_deployment.resources[0].status.readyReplicas > 0
  retries: 10
  delay: 30

- name: Création du cluster Ceph
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: ceph.rook.io/v1
      kind: CephCluster
      metadata:
        name: "{{ ceph_cluster_name }}"
        namespace: storage
      spec:
        cephVersion:
          image: ceph/ceph:v{{ ceph_version }}
        dataDirHostPath: /var/lib/rook
        mon:
          count: 3
          allowMultiplePerNode: false
        mgr:
          count: 1
          modules:
            - name: pg_autoscaler
              enabled: true
        dashboard:
          enabled: true
          ssl: false
        storage:
          useAllNodes: true
          useAllDevices: false
          nodes:
            - name: "{{ item }}"
              devices:
                - name: "/dev/xvdf"
      loop: "{{ groups['eks_nodes'] | default([]) }}"

- name: Attente que le cluster Ceph soit prêt
  kubernetes.core.k8s_info:
    kind: CephCluster
    name: "{{ ceph_cluster_name }}"
    namespace: storage
  register: ceph_cluster
  until: ceph_cluster.resources[0].status.phase == "Ready"
  retries: 30
  delay: 60

- name: Création du Filesystem CephFS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: ceph.rook.io/v1
      kind: CephFilesystem
      metadata:
        name: cephfs
        namespace: storage
      spec:
        metadataPool:
          replicated:
            size: "{{ ceph_replicas }}"
        dataPools:
          - name: "{{ ceph_pool_name }}"
            replicated:
              size: "{{ ceph_replicas }}"
        metadataServer:
          activeCount: 1
          activeStandby: true

- name: Création de la StorageClass pour CephFS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: cephfs-sc
      provisioner: rook-ceph.cephfs.csi.ceph.com
      parameters:
        clusterID: storage
        fsName: cephfs
        pool: "{{ ceph_pool_name }}"
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: storage
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: storage
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
        csi.storage.k8s.io/node-stage-secret-namespace: storage
      reclaimPolicy: Delete
      allowVolumeExpansion: true