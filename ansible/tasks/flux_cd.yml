---
# Déploiement de Flux CD pour GitOps
- name: Ajout du dépôt Helm Flux
  kubernetes.core.helm_repository:
    name: fluxcd
    repo_url: https://charts.fluxcd.io

- name: Création du namespace flux-system
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: flux-system

- name: Création du secret pour l'accès SSH au dépôt Git
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: flux-git-deploy
        namespace: flux-system
      type: Opaque
      stringData:
        identity: "{{ lookup('env', 'FLUX_SSH_KEY') }}"
        identity.pub: "{{ lookup('env', 'FLUX_SSH_KEY_PUB') }}"
        known_hosts: "{{ lookup('env', 'FLUX_KNOWN_HOSTS', default='github.com ssh-rsa ') }}"

- name: Installation de Flux CD avec Helm
  kubernetes.core.helm:
    name: flux
    chart_ref: fluxcd/flux
    release_namespace: flux-system
    create_namespace: false
    values:
      git:
        url: "{{ git_repository }}"
        branch: "{{ git_branch }}"
        path: "clusters/{{ environment }}"
        pollInterval: "1m"
        secretName: flux-git-deploy
      syncGarbageCollection:
        enabled: true
      registry:
        automationInterval: "5m"
      manifestGeneration: true
      memcached:
        enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

- name: Installation de Flux Helm Operator
  kubernetes.core.helm:
    name: helm-operator
    chart_ref: fluxcd/helm-operator
    release_namespace: flux-system
    create_namespace: false
    values:
      git:
        secretName: flux-git-deploy
      helm:
        versions: "v3"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      chartsSyncInterval: "3m"
      statusUpdateInterval: "30s"

- name: Attente que Flux soit prêt
  kubernetes.core.k8s_info:
    kind: Deployment
    name: flux
    namespace: flux-system
  register: flux_deployment
  until: flux_deployment.resources[0].status.readyReplicas is defined and flux_deployment.resources[0].status.readyReplicas > 0
  retries: 10
  delay: 30

- name: Création des manifestes Kustomization
  ansible.builtin.file:
    path: "{{ playbook_dir }}/files/flux-system"
    state: directory
    mode: '0755'

- name: Création du fichier kustomization.yaml
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/files/flux-system/kustomization.yaml"
    content: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
        - gotk-components.yaml
        - gotk-sync.yaml

- name: Création du fichier gotk-sync.yaml
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/files/flux-system/gotk-sync.yaml"
    content: |
      apiVersion: source.toolkit.fluxcd.io/v1beta1
      kind: GitRepository
      metadata:
        name: flux-system
        namespace: flux-system
      spec:
        interval: 1m0s
        ref:
          branch: {{ git_branch }}
        secretRef:
          name: flux-git-deploy
        url: {{ git_repository }}
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1beta1
      kind: Kustomization
      metadata:
        name: flux-system
        namespace: flux-system
      spec:
        interval: 10m0s
        path: ./clusters/{{ environment }}
        prune: true
        sourceRef:
          kind: GitRepository
          name: flux-system
        validation: client

- name: Récupération de la clé publique Flux
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: flux-system
    name: flux-git-deploy
  register: flux_secret

- name: Affichage de la clé publique Flux
  ansible.builtin.debug:
    msg: "Clé publique Flux à ajouter à votre dépôt Git comme clé de déploiement : {{ flux_secret.resources[0].data['identity.pub'] | b64decode }}"